services:
  petclinic-mysql:
    image: mysql:8.0
    container_name: petclinic-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: petclinic
      MYSQL_USER: petclinic
      MYSQL_PASSWORD: petclinic
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Service requis UNIQUEMENT si vous gardez PostgresIntegrationTests.
  # Spring Boot cible ce service par son nom littéral "postgres"
  # (cf. spring.docker.compose.start.arguments dans les logs d'erreur).
  # Si vous ne testez pas Postgres en prod, vous pouvez supprimer ce bloc
  # et exclure le test correspondant dans le Jenkinsfile (voir stage 2b).
  postgres:
    image: postgres:16
    container_name: petclinic-postgres
    restart: on-failure
    environment:
      POSTGRES_DB: petclinic
      POSTGRES_USER: petclinic
      POSTGRES_PASSWORD: petclinic
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petclinic"]
      interval: 5s
      timeout: 5s
      retries: 10

  petclinic-app:
    build: .
    container_name: petclinic-app
    depends_on:
      petclinic-mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://petclinic-mysql:3306/petclinic
      - SPRING_DATASOURCE_USERNAME=petclinic
      - SPRING_DATASOURCE_PASSWORD=petclinic
    restart: on-failure

volumes:
  mysql-data:
