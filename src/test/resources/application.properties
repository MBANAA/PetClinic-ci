# Force le profil h2 quoi qu'il arrive
spring.profiles.active=h2

# Force l'initialisation même si le profil est "default"
spring.sql.init.mode=always

# Désactive Hibernate DDL pour laisser schema.sql faire le travail proprement
spring.jpa.hibernate.ddl-auto=none

# TRÈS IMPORTANT : Dit à Spring d'attendre la fin de l'init de la DB pour lancer les tests
spring.jpa.defer-datasource-initialization=true

# Chemins explicites vers tes scripts
spring.sql.init.schema-locations=classpath:db/h2/schema.sql
spring.sql.init.data-locations=classpath:db/h2/data.sql