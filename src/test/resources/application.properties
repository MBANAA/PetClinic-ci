# 1. Utilisation de H2 en mémoire pour les tests unitaires
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver

# 2. Force Hibernate à créer les tables d'abord
spring.jpa.hibernate.ddl-auto=create-drop

# 3. TRÈS IMPORTANT : Force Spring Boot à exécuter data.sql APRÈS Hibernate
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true